<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ဇာတ်လမ်း(စ/ဆုံး)</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap"><style id="css">
:root{--bg:#14172b;--panel:#1d2140;--line:#2f3563;--text:#f1eee6;--mute:#a4a8c4;--jade:#43c0a3;--gold:#eab54f;--red:#e0585a;--on:#10142a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2ee;--panel:#fff;--line:#dcd8cf;--text:#1b1d33;--mute:#666a86;--jade:#0f8a72;--gold:#a8741a;--red:#c23a3d;--on:#fff}}
:root[data-theme="light"]{--bg:#f4f2ee;--panel:#fff;--line:#dcd8cf;--text:#1b1d33;--mute:#666a86;--jade:#0f8a72;--gold:#a8741a;--red:#c23a3d;--on:#fff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Myanmar","Padauk","Myanmar Text",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--jade);color:var(--on);font-weight:600}
.status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.b-no{background:var(--red);color:#fff}.b-wait{background:var(--gold);color:#1b1d33}.b-ok{background:var(--jade);color:var(--on)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;width:100%}
.poster{aspect-ratio:3/4;display:flex;align-items:flex-end;padding:10px;font-size:34px;font-weight:700;letter-spacing:2px;position:relative}
.poster small{position:absolute;top:8px;right:8px;font-size:11px;background:#0008;color:#fff;padding:1px 8px;border-radius:99px;letter-spacing:0}
.lock{position:absolute;inset:0;background:#0b0d1d99;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.info{padding:8px 10px 10px;font-size:14px}.info span{display:block;font-size:12px;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 8px}
.plans{display:grid;gap:8px}
.plan{display:flex;justify-content:space-between;align-items:center;background:none;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;text-align:left}
.plan.sel{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 14%,transparent)}
.plan b{color:var(--gold)}
.btn{background:var(--jade);color:var(--on);font-weight:600;padding:10px 16px;border-radius:10px;width:100%;margin-top:10px}
.btn.alt{background:none;border:1.5px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpay{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
input[type=file]{width:100%;margin-top:8px;font-size:13px;color:var(--mute)}
.hide{display:none}
.fld{width:100%;margin-top:8px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .acts{display:flex;gap:6px}.row .acts button{padding:5px 12px;border-radius:8px;font-size:13px}
.ok{background:var(--jade);color:var(--on)}.no{background:var(--red);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:8px}

.btn{display:block;text-align:center;text-decoration:none}.btn.off{opacity:.45}.mini{background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:8px;font-size:13px}.card{cursor:pointer}
</style></head><body>
<template id="bodytpl"><div class="wrap">
  <div class="top">
    <h1 id="siteTitle"></h1>
    <button id="tabAdmin" class="mini hide" onclick="toggleAdmin()">ပြင်ရန်</button>
  </div>
  <section id="user">
    <div class="note" id="intro" style="font-size:14px;margin-bottom:12px"></div>
    <div class="panel">
      <h2>၁။ ဈေးနှုန်းရွေးပါ</h2>
      <div class="plans" id="plans"></div>
      <div class="note" id="pickInfo" style="margin-top:10px;font-size:14px;color:var(--gold)"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="panel" style="margin-top:14px">
      <h2>၂။ ငွေလွှဲပါ</h2>
      <div class="kpay" id="kpayBox"></div>
      <h2 style="margin-top:14px">၃။ ပြေစာပို့ပါ</h2>
      <a class="btn" id="sendBtn" target="_blank" rel="noopener" onclick="return trySend()">ပြေစာပို့ရန် (Telegram)</a>
      <div class="note" id="sendNote"></div>
      <pre id="msgPrev" style="display:none;white-space:pre-wrap;font:inherit;font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;margin:10px 0 0"></pre>
      <button class="btn alt hide" id="copyBtn" onclick="copyMsg()">စာကူးရန်</button>
    </div>
  </section>
  <section id="admin" class="hide">
    <div class="panel">
      <h2>ဆိုဒ်အချက်အလက်</h2>
      <input class="fld" id="sTitle" placeholder="ဆိုဒ်နာမည်">
      <input class="fld" id="sIntro" placeholder="မိတ်ဆက်စာ">
      <input class="fld" id="sKNo" placeholder="KPay နံပါတ်">
      <input class="fld" id="sKName" placeholder="KPay အမည်">
      <input class="fld" id="sTg" placeholder="Telegram username (@ မပါဘဲ)">
      <input class="fld" id="sP1" inputmode="numeric" placeholder="၁ ကား ဈေး (ဂဏန်းသာ)">
      <input class="fld" id="sP2" inputmode="numeric" placeholder="၂ ကား ဈေး (ဂဏန်းသာ)">
      <button class="btn" onclick="saveSettings()">သိမ်းမည်</button>
    </div>
    <div class="panel">
      <h2>ရုပ်ရှင်စီမံရန်</h2>
      <div id="mlist"></div>
      <h2 id="formTitle" style="margin-top:16px">ရုပ်ရှင်အသစ်ထည့်ရန်</h2>
      <input class="fld" id="fT" placeholder="ကားနာမည်">
      <input class="fld" id="fE" placeholder="စာသား (ဥပမာ - စ၊ အပိုင်း ၁-၁၀၊ ဒုတိယပိုင်း၊ ဆုံး)">
      <input type="file" id="fP" accept="image/*">
      <button class="btn" style="width:100%" onclick="saveMovie()">သိမ်းမည်</button>
      <button class="btn alt hide" id="cancelBtn" style="width:100%" onclick="resetForm()">ပယ်ဖျက်မည်</button>
      <div class="note" id="saveNote">ပုံကို အလိုအလျောက် ချုံ့ပေးပါမည်။ သိမ်းပြီးလျှင် ဝယ်သူများ စာမျက်နှာတွင် ပြောင်းသွားပါမည်။</div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
</template>

<script id="app">document.body.appendChild(document.getElementById("bodytpl").content.cloneNode(true));
var D=JSON.parse(document.getElementById("seed").textContent),S=D.settings,movies=D.movies;
var $=function(i){return document.getElementById(i)};
var sel=0,picks=[],editing=-1,newUrl=null,delArm=-1;
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function kyat(n){return Number(n||0).toLocaleString("en-US")+" ကျပ်"}
function plans(){return[{k:1,p:S.price1},{k:2,p:S.price2}]}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2600)}
function selPlan(i){sel=i;picks=picks.slice(0,plans()[i].k);render()}
function pick(i){var k=picks.indexOf(i);if(k>=0)picks.splice(k,1);else if(picks.length<plans()[sel].k)picks.push(i);else toast("ရွေးပြီးပြည့်ပါပြီ – ဖယ်ချင်လျှင် ရွေးထားသောကားကို ပြန်နှိပ်ပါ");render()}
function msgText(){var p=plans()[sel];return "မင်္ဂလာပါ၊ ပြေစာပို့ပါသည်။\nရွေးထားသောကား: "+picks.map(function(i){return movies[i].t}).join(", ")+"\nပမာဏ: "+kyat(p.p)+"\nသက်တမ်း: ၁ လ\n(ပြေစာ screenshot ကို ဒီအောက်မှာ ပို့ပါမည်)"}
function ready(){return S.tg&&picks.length===plans()[sel].k}
function trySend(){if(!ready()){toast(!S.tg?"Telegram username မထည့်ရသေးပါ":"ကားအရင်ရွေးပါ");return false}return true}
function render(){
 $("siteTitle").textContent=S.title;document.title=S.title;$("intro").textContent=S.intro;
 var pl=plans();
 $("plans").innerHTML=pl.map(function(p,i){return '<button class="plan'+(i===sel?' sel':'')+'" onclick="selPlan('+i+')"><span>'+p.k+' ကား</span><b>'+kyat(p.p)+'</b></button>'}).join("");
 $("pickInfo").textContent="ရုပ်ရှင်ရွေးပါ – ရွေးထားသည် "+picks.length+"/"+pl[sel].k;
 $("grid").innerHTML=movies.map(function(m,i){var pk=picks.indexOf(i)>=0;var bg=m.img?'url('+m.img+') center/cover':m.g;return '<button class="card" style="'+(pk?'outline:3px solid var(--gold)':'')+'" onclick="pick('+i+')"><div class="poster" style="background:'+bg+'">'+(m.img?'':esc(m.z))+(m.ep?'<small>'+esc(m.ep)+'</small>':'')+(pk?'<div class="lock">✔ ရွေးထားသည်</div>':'')+'</div><div class="info">'+esc(m.t)+'</div></button>'}).join("");
 $("kpayBox").innerHTML='KPay နံပါတ် – <b>'+esc(S.kpayNo)+'</b><br>အမည် – '+esc(S.kpayName)+'<div class="note">လွှဲရမည့်ပမာဏ – '+kyat(pl[sel].p)+'</div>';
 var a=$("sendBtn");a.classList.toggle("off",!ready());
 if(ready())a.href="https://t.me/"+encodeURIComponent(S.tg)+"?text="+encodeURIComponent(msgText());else a.removeAttribute("href");
 $("sendNote").textContent=ready()?"Telegram ဖွင့်ပါမည်။ ရွေးထားသောကားစာ ကြိုထည့်ပေးထားပြီး ပြေစာပုံကိုသာ ထပ်ပို့ပါ။":(!S.tg?"":"ကားရွေးပြီးမှ ပို့လို့ရပါမည်");
 renderManage();
}
function resizeImg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(480,im.width),h=Math.round(im.height*w/im.width);var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);cb(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)}
$("fP").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;resizeImg(f,function(u){newUrl=u;$("saveNote").textContent="ပုံရွေးပြီးပါပြီ ("+Math.round(u.length*0.75/1024)+" KB)"})});
function renderManage(){$("mlist").innerHTML=movies.map(function(m,i){return '<div class="row"><div>'+esc(m.t)+'<br><span style="color:var(--mute);font-size:12px">'+esc(m.ep)+'</span></div><div class="acts"><button class="ok" onclick="editMovie('+i+')">ပြင်</button><button class="no" onclick="delMovie('+i+')">ဖျက်</button></div></div>'}).join("")}
function resetForm(){editing=-1;newUrl=null;["fT","fE","fP"].forEach(function(i){$(i).value=""});$("formTitle").textContent="ရုပ်ရှင်အသစ်ထည့်ရန်";$("cancelBtn").classList.add("hide")}
function editMovie(i){var m=movies[i];editing=i;newUrl=null;$("fT").value=m.t;$("fE").value=m.ep||"";$("fP").value="";$("formTitle").textContent="ပြင်နေသည် – "+m.t;$("cancelBtn").classList.remove("hide");$("fT").scrollIntoView({behavior:"smooth",block:"center"})}
function saveMovie(){var t=$("fT").value.trim();if(!t){toast("ကားနာမည်ထည့်ပါ");return}
 var m=editing>=0?movies[editing]:{g:"linear-gradient(160deg,hsl("+(Math.random()*360|0)+",45%,35%),hsl("+(Math.random()*360|0)+",40%,16%))"};
 m.t=t;m.z=t.slice(0,2);m.ep=$("fE").value.trim();if(newUrl)m.img=newUrl;
 if(editing<0)movies.unshift(m);
 picks=[];resetForm();render();persist()}
function delMovie(i){if(delArm!==i){delArm=i;toast("ဖျက်ရန် ‘ဖျက်’ ကို ထပ်နှိပ်ပါ");return}delArm=-1;movies.splice(i,1);picks=[];render();persist()}
function fillSettings(){$("sTitle").value=S.title;$("sIntro").value=S.intro;$("sKNo").value=S.kpayNo;$("sKName").value=S.kpayName;$("sTg").value=S.tg;$("sP1").value=S.price1;$("sP2").value=S.price2}
function saveSettings(){S.title=$("sTitle").value.trim()||S.title;S.intro=$("sIntro").value.trim();S.kpayNo=$("sKNo").value.trim();S.kpayName=$("sKName").value.trim();S.tg=$("sTg").value.replace(/[@\s]/g,"").replace(/^.*t\.me\//,"");S.price1=parseInt($("sP1").value.replace(/\D/g,""),10)||S.price1;S.price2=parseInt($("sP2").value.replace(/\D/g,""),10)||S.price2;render();persist()}
function toggleAdmin(){var a=$("admin").classList.toggle("hide");$("user").classList.toggle("hide",!a);$("tabAdmin").textContent=a?"ပြင်ရန်":"စာမျက်နှာကြည့်ရန်";if(!a)fillSettings()}
function showAdmin(){$("tabAdmin").classList.remove("hide")}
function pack(){return JSON.stringify({settings:S,movies:movies}).replace(/</g,"\\u003c")}
function buildHtml(){var lk=document.querySelector('link[href*="fonts.googleapis"]');
 return '<!doctype html>\n<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(document.title)+'</title>'+(lk?'<link rel="stylesheet" href="'+lk.getAttribute("href")+'">':'')+'<style id="css">'+$("css").textContent+'</style></head><body>\n<template id="bodytpl">'+$("bodytpl").innerHTML+'</template>\n<script id="seed" type="application/json">'+pack()+'<\/script>\n<script id="app">'+$("app").textContent+'<\/script>\n</body></html>'}
function persist(){var p;try{p=claude.use("artifact")}catch(e){p=Promise.resolve(null)}
 return p.then(function(a){if(!a)throw{code:"not_granted"};return a.publish(buildHtml())}).then(function(){toast("သိမ်းပြီးပါပြီ")}).catch(function(e){toast("သိမ်း၍မရပါ ("+((e&&e.code)||"error")+")")})}
try{if(location.hash==="#admin")showAdmin();claude.use("user").then(function(u){if(u&&u.isOwner&&u.isOwner())showAdmin()})}catch(e){}
